<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Complaints</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Student Service System</h1>
    </header>

    <main>

        <h2>Manage Student Complaints</h2>

        
<div>
    <input
        type="text"
        id="searchInput"
        placeholder="Search by subject or student email..."
    >

    <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
    </select>

    <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Academic">Academic</option>
        <option value="Hostel">Hostel</option>
        <option value="Transport">Transport</option>
        <option value="IT/Internet">IT/Internet</option>
        <option value="Library">Library</option>
        <option value="Examination">Examination</option>
        <option value="Other">Other</option>
    </select>
</div>

<br>

<div id="complaintsList">
    <p>Loading complaints...</p>
</div>

        <br>

        <a href="admin-dashboard.html" class="btn">
            Back to Admin Dashboard
        </a>

    </main>

    
<script>
    let allComplaints = [];

    function loadComplaints() {
        fetch("/admin/complaints")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load complaints");
                }
                return response.json();
            })
            .then(complaints => {
                allComplaints = complaints;
                displayComplaints();
            })
            .catch(error => {
                console.error(error);
                document.getElementById("complaintsList").innerHTML =
                    "<p>Error loading complaints.</p>";
            });
    }

    function displayComplaints() {
        const list = document.getElementById("complaintsList");
        const search = document.getElementById("searchInput").value.toLowerCase();
        const status = document.getElementById("statusFilter").value;
        const category = document.getElementById("categoryFilter").value;

        const filtered = allComplaints.filter(complaint => {
            const subject = (complaint.subject || "").toLowerCase();
            const email = complaint.student?.email || "";
            const matchesSearch =
                subject.includes(search) || email.toLowerCase().includes(search);

            return matchesSearch &&
                (!status || complaint.status === status) &&
                (!category || complaint.category === category);
        });

        if (filtered.length === 0) {
            list.innerHTML = "<p>No matching complaints found.</p>";
            return;
        }

        list.innerHTML = "";

        filtered.forEach(complaint => {
            const div = document.createElement("div");

            div.innerHTML = `
                <h3>${complaint.subject || "No subject"}</h3>
                <p><strong>Category:</strong> ${complaint.category || "Not specified"}</p>
                <p><strong>Student:</strong> ${complaint.student?.name || "Unknown Student"}</p>
                <p><strong>Email:</strong> ${complaint.student?.email || "Unknown Email"}</p>
                <p><strong>Description:</strong> ${complaint.description || ""}</p>
                <p><strong>Status:</strong>
                    <select id="status-${complaint._id}">
                        <option value="Pending" ${complaint.status === "Pending" ? "selected" : ""}>Pending</option>
                        <option value="In Progress" ${complaint.status === "In Progress" ? "selected" : ""}>In Progress</option>
                        <option value="Resolved" ${complaint.status === "Resolved" ? "selected" : ""}>Resolved</option>
                    </select>
                    <button class="btn" onclick="updateStatus('${complaint._id}')">Update</button>
                </p>
                <p><strong>Date:</strong> ${complaint.createdAt ? new Date(complaint.createdAt).toLocaleString() : "Unknown"}</p>
                <hr>
            `;

            list.appendChild(div);
        });
    }

    function updateStatus(complaintId) {
        const status = document.getElementById("status-" + complaintId).value;

        fetch("/admin/update-status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ complaintId, status })
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            loadComplaints();
        })
        .catch(error => {
            console.error(error);
            alert("Error updating status.");
        });
    }

    document.getElementById("searchInput").addEventListener("input", displayComplaints);
    document.getElementById("statusFilter").addEventListener("change", displayComplaints);
    document.getElementById("categoryFilter").addEventListener("change", displayComplaints);

    loadComplaints();
</script>

</body>

</html>
